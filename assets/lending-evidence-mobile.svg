<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700" role="img" aria-labelledby="title desc">
  <title id="title">Lending, with the evidence attached</title>
  <desc id="desc">A broker statement supplies dated shares-on-loan records and a net-fee ledger. Lending income is shown separately, without adding it again to broker profit and loss. This is a reporting diagram, not account data.</desc>
  <defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#333B45"/><stop offset="1" stop-color="#262A33"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFF1E5" stroke-opacity=".035"/></pattern></defs>
  <rect width="520" height="700" fill="url(#paper)"/><rect width="520" height="700" fill="url(#grid)"/>
  <g fill="#FFF1E5" font-family="Arial, sans-serif">
    <text x="30" y="45" font-size="16" letter-spacing="1.6" fill="#C9BEB3">LENDING / BROKER EVIDENCE</text>
    <text x="30" y="95" font-family="Georgia, serif" font-size="37">The record behind</text>
    <text x="30" y="136" font-family="Georgia, serif" font-size="37">the income.</text>
    <path d="M30 161H490" stroke="#FFF1E5" stroke-opacity=".22"/>
    <g transform="translate(30 191)">
      <path d="M0 0H29L41 12V55H0Z" stroke="#E8C66F" stroke-width="2" fill="none"/>
      <path d="M28 1V13H40M9 25H31M9 34H31M9 43H23" stroke="#E8C66F" stroke-width="2" fill="none"/>
      <text x="63" y="19" font-size="24">IBKR statement</text>
      <text x="63" y="48" font-size="18" fill="#C9BEB3">Reporting date + coverage</text>
    </g>
    <path d="M260 257V286" stroke="#4FC3C9" stroke-width="2"/>
    <circle cx="260" cy="275" r="4" fill="#4FC3C9"/>
    <g transform="translate(30 292)">
      <rect width="460" height="130" fill="#FFF1E5" fill-opacity=".04" stroke="#FFF1E5" stroke-opacity=".25"/><rect width="3" height="130" fill="#E8C66F"/>
      <text x="20" y="30" font-size="16" letter-spacing="1.5" fill="#E8C66F">SHARES ON LOAN</text>
      <text x="20" y="72" font-family="Georgia, serif" font-size="30">The dated position</text>
      <path d="M20 90H440" stroke="#FFF1E5" stroke-opacity=".18"/>
      <text x="20" y="115" font-size="18" fill="#C9BEB3">Quantity · collateral · broker date</text>
    </g>
    <g transform="translate(30 439)">
      <rect width="460" height="130" fill="#FFF1E5" fill-opacity=".04" stroke="#FFF1E5" stroke-opacity=".25"/><rect width="3" height="130" fill="#4FC3C9"/>
      <text x="20" y="30" font-size="16" letter-spacing="1.5" fill="#4FC3C9">NET FEE HISTORY</text>
      <text x="20" y="72" font-family="Georgia, serif" font-size="30">The earned-fee ledger</text>
      <path d="M20 90H440" stroke="#FFF1E5" stroke-opacity=".18"/>
      <text x="20" y="115" font-size="18" fill="#C9BEB3">Value date · currency · signed net fee</text>
    </g>
    <path d="M30 598H490" stroke="#FFF1E5" stroke-opacity=".22"/>
    <text x="30" y="632" font-size="21">Visible income.</text>
    <text x="30" y="660" font-size="21">No extra addition to broker P&amp;L.</text>
    <text x="30" y="688" font-size="15" fill="#C9BEB3">Reporting only · Participation stays with IBKR</text>
  </g>
</svg>
